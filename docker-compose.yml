services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: casemesh-postgres
    environment:
      POSTGRES_USER: casemesh
      POSTGRES_PASSWORD: casemesh_local
      POSTGRES_DB: casemesh
    ports:
      - "5432:5432"
    volumes:
      - casemesh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casemesh -d casemesh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casemesh_postgres_data:
