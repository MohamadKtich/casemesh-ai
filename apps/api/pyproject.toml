[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casemesh-api"
version = "0.7.0"
description = "CaseMesh AI FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiofiles>=24.1,<25.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "boto3>=1.43.92,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.2.11,<1.3",
  "langgraph-checkpoint-postgres>=3.1.2,<4.0",
  "mcp>=2.0,<3.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "pgvector>=0.4,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "structlog>=25.1,<26.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff==0.16.6",
  "mypy>=1.15,<2.0",
  "types-aiofiles>=24.1,<25.0",
  "types-aiofiles>=24.1,<25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src"]