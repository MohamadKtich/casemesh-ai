name: CaseMesh Final Full Regression

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VALIDATE_CASEMESH_FINAL to run the final full regression gate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: casemesh-final-full-regression
  cancel-in-progress: false

jobs:
  preflight:
    name: Final Regression Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main branch and confirmation
        shell: bash
        env:
          VALIDATE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${VALIDATE_CONFIRMATION}" = "VALIDATE_CASEMESH_FINAL"
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          echo "FINAL_REGRESSION_PREFLIGHT=PASS"
          echo "REAL_AWS_CALLS=NONE"

  api:
    name: API Final Quality Gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run MyPy
        run: python -m mypy src

      - name: Run full Pytest suite
        run: python -m pytest -q

      - name: Verify API validation did not modify tracked files
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "API_TRACKED_TREE=CLEAN"

  web:
    name: Web Final Quality Gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Verify web validation did not modify tracked files
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "WEB_TRACKED_TREE=CLEAN"

  platform:
    name: Platform Final Quality Gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build API container
        run: docker build --file apps/api/Dockerfile -t casemesh-api:final-check .

      - name: Verify API container runtime user
        shell: bash
        run: |
          set -euo pipefail
          runtime_user="$(docker image inspect casemesh-api:final-check --format '{{.Config.User}}')"
          working_dir="$(docker image inspect casemesh-api:final-check --format '{{.Config.WorkingDir}}')"
          test "${runtime_user}" = "casemesh"
          test "${working_dir}" = "/app"
          echo "API_CONTAINER_RUNTIME_USER=VERIFIED"
          echo "API_CONTAINER_WORKDIR=VERIFIED"

      - name: Ensure Bicep CLI is available
        run: az bicep install

      - name: Validate Azure Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep build \
            --file infrastructure/azure/main.bicep \
            --outfile "${RUNNER_TEMP}/casemesh-main-final.json"
          test -f "${RUNNER_TEMP}/casemesh-main-final.json"
          echo "AZURE_BICEP=PASS"

      - name: Verify platform validation did not modify tracked files
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PLATFORM_TRACKED_TREE=CLEAN"

  complete:
    name: Phase 37O.7 Completion
    needs:
      - preflight
      - api
      - web
      - platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit final regression markers
        shell: bash
        run: |
          set -euo pipefail
          echo "PHASE_37O_7=PASS"
          echo "API_RUFF=PASS"
          echo "API_MYPY=PASS"
          echo "API_PYTEST_FULL_SUITE=PASS"
          echo "WEB_LINT=PASS"
          echo "WEB_BUILD=PASS"
          echo "DOCKER_COMPOSE=PASS"
          echo "API_CONTAINER_BUILD=PASS"
          echo "AZURE_BICEP=PASS"
          echo "TRACKED_WORKING_TREES=CLEAN"
          echo "REAL_AWS_CALLS=NONE"
          echo "AWS_V1_1_VALIDATION=COMPLETE"
          echo "NEXT=FINAL_DOCUMENTATION_AND_CLEANUP"
