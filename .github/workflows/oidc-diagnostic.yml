name: CaseMesh OIDC Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-diagnostic:
    name: OIDC Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show immutable repository identifiers
        run: |
          echo "repository=${{ github.repository }}"
          echo "repository_id=${{ github.repository_id }}"
          echo "repository_owner=${{ github.repository_owner }}"
          echo "repository_owner_id=${{ github.repository_owner_id }}"
          echo "ref=${{ github.ref }}"

      - name: Inspect OIDC claims safely
        shell: bash
        run: |
          response="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          )"

          token="$(
            printf '%s' "$response" |
            python -c 'import json, sys; print(json.load(sys.stdin)["value"])'
          )"

          TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          safe_claims = (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
          )

          for key in safe_claims:
              print(f"{key}={claims.get(key)}")
          PY