name: CaseMesh AWS Final Regression

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VALIDATE_CASEMESH_FINAL_REGRESSION to run the final offline regression gate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: casemesh-aws-final-regression
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm final regression run
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require main branch and confirmation
        shell: bash
        env:
          VALIDATE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${VALIDATE_CONFIRMATION}" = "VALIDATE_CASEMESH_FINAL_REGRESSION"
          echo "FINAL_REGRESSION_CONFIRMATION=PASS"

  api:
    name: API final regression
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run MyPy
        run: python -m mypy src

      - name: Run full Pytest suite
        run: python -m pytest -q

      - name: Verify no AWS credentials were injected
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          echo "API_REAL_AWS_CALLS=NONE"

  web:
    name: Web final regression
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  platform:
    name: Platform final regression
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build API container
        run: docker build --file apps/api/Dockerfile -t casemesh-api:final-regression .

      - name: Verify API container runtime contract
        shell: bash
        run: |
          set -euo pipefail
          runtime_user="$(docker image inspect casemesh-api:final-regression --format '{{.Config.User}}')"
          working_dir="$(docker image inspect casemesh-api:final-regression --format '{{.Config.WorkingDir}}')"
          test "${runtime_user}" = "casemesh"
          test "${working_dir}" = "/app"
          echo "API_CONTAINER_RUNTIME_CONTRACT=PASS"

      - name: Ensure Bicep CLI is available
        run: az bicep install

      - name: Validate Azure Bicep compilation
        shell: bash
        run: |
          set -euo pipefail
          az bicep build \
            --file infrastructure/azure/main.bicep \
            --outfile "${RUNNER_TEMP}/casemesh-main-final.json"
          test -s "${RUNNER_TEMP}/casemesh-main-final.json"
          echo "AZURE_BICEP_COMPILE=PASS"

      - name: Verify validation remains non-deploying
        shell: bash
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          echo "CLOUD_DEPLOYMENT=NONE"
          echo "REAL_AWS_CALLS=NONE"

  final:
    name: AWS v1.1 final regression result
    needs:
      - api
      - web
      - platform
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Emit final validation markers
        shell: bash
        run: |
          set -euo pipefail
          echo "PHASE_37O_7=PASS"
          echo "API_RUFF=PASS"
          echo "API_MYPY=PASS"
          echo "API_FULL_PYTEST=PASS"
          echo "WEB_LINT=PASS"
          echo "WEB_BUILD=PASS"
          echo "DOCKER_COMPOSE=PASS"
          echo "API_CONTAINER_BUILD=PASS"
          echo "AZURE_BICEP_COMPILE=PASS"
          echo "REAL_AWS_CALLS=NONE"
          echo "CLOUD_DEPLOYMENT=NONE"
          echo "AWS_INTELLIGENCE_V1_1_REGRESSION=PASS"
          echo "NEXT=FINAL_DOCUMENTATION_AND_CLEANUP"
