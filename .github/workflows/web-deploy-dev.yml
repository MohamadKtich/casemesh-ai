name: CaseMesh Web Deploy Dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm deployment to Azure dev"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-deploy-dev-${{ github.ref }}
  cancel-in-progress: false

env:
  STATIC_WEB_APP_URL: https://zealous-pebble-08744c900.5.azurestaticapps.net

jobs:
  deploy:
    name: Deploy Web to Azure Dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
      VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
      VITE_ENTRA_API_CLIENT_ID: ${{ vars.VITE_ENTRA_API_CLIENT_ID }}

    steps:
      - name: Require main branch and confirmation
        shell: bash
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          test "${GITHUB_REF}" = "refs/heads/main"
          test "${DEPLOY_CONFIRM}" = "DEPLOY"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate frontend deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            "VITE_API_BASE_URL"
            "VITE_ENTRA_TENANT_ID"
            "VITE_ENTRA_CLIENT_ID"
            "VITE_ENTRA_API_CLIENT_ID"
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::Required repository variable ${variable_name} is missing or empty."
              exit 1
            fi
          done

          case "${VITE_API_BASE_URL}" in
            https://*)
              ;;
            *)
              echo "::error::VITE_API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

          echo "Frontend deployment configuration is valid."

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Oxlint
        working-directory: apps/web
        run: npm run lint

      - name: Build production frontend
        working-directory: apps/web
        run: npm run build

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail

          test -f apps/web/dist/index.html

          if ! grep -R -F \
            "${VITE_API_BASE_URL}" \
            apps/web/dist \
            >/dev/null; then
            echo "::error::Production API URL was not found in the compiled frontend."
            exit 1
          fi

          echo "Production build contains the expected API URL."

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          output_location: ""
          skip_app_build: true

      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /tmp/casemesh-web.html \
                --write-out "%{http_code}" \
                --max-time 15 \
                "${STATIC_WEB_APP_URL}" || true
            )"

            echo "Attempt ${attempt}/30 - HTTP ${status}"

            if [ "${status}" = "200" ]; then
              if grep -q '<div id="root">' /tmp/casemesh-web.html; then
                echo "CaseMesh production frontend is ready."
                exit 0
              fi

              echo "HTTP 200 received, waiting for expected frontend content."
            fi

            sleep 10
          done

          echo "::error::Production frontend verification failed."
          exit 1