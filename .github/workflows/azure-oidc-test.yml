name: CaseMesh Azure OIDC Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-oidc-test:
    name: Azure OIDC Login Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require main branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show \
            --query "{subscription:name,subscriptionId:id,tenantId:tenantId}" \
            --output json

      - name: Verify Container App access
        run: |
          az containerapp show \
            --name casemesh-api-dev \
            --resource-group casemesh-rg-dev \
            --query "{name:name,image:properties.template.containers[0].image,fqdn:properties.configuration.ingress.fqdn}" \
            --output json