name: CaseMesh GHCR Publish Test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mohamadktich/casemesh-api

jobs:
  publish-image:
    name: Build and Publish API Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require main branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable API image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Published image: ${image}"

          docker pull "${image}"

          runtime_user="$(
            docker image inspect "${image}" \
              --format '{{.Config.User}}'
          )"

          working_dir="$(
            docker image inspect "${image}" \
              --format '{{.Config.WorkingDir}}'
          )"

          echo "Runtime user: ${runtime_user}"
          echo "Working directory: ${working_dir}"

          test "${runtime_user}" = "casemesh"
          test "${working_dir}" = "/app"