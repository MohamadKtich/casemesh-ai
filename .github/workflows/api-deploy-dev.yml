name: CaseMesh API Deploy Dev

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mohamadktich/casemesh-api
  RESOURCE_GROUP: casemesh-rg-dev
  CONTAINER_APP: casemesh-api-dev

jobs:
  deploy:
    name: Deploy API to Azure Dev
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require main branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable API image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current deployment
        id: previous
        shell: bash
        run: |
          previous_image="$(
            az containerapp show \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "properties.template.containers[0].image" \
              --output tsv
          )"

          previous_revision="$(
            az containerapp show \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "properties.latestReadyRevisionName" \
              --output tsv
          )"

          echo "Previous image: ${previous_image}"
          echo "Previous ready revision: ${previous_revision}"

          echo "image=${previous_image}" >> "${GITHUB_OUTPUT}"
          echo "revision=${previous_revision}" >> "${GITHUB_OUTPUT}"

      - name: Deploy immutable image
        id: deploy
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Deploying image: ${image}"

          az containerapp update \
            --name "${CONTAINER_APP}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${image}" \
            --output none

      - name: Wait for ready revision
        shell: bash
        run: |
          expected_image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          for attempt in $(seq 1 30); do
            ready_revision="$(
              az containerapp show \
                --name "${CONTAINER_APP}" \
                --resource-group "${RESOURCE_GROUP}" \
                --query "properties.latestReadyRevisionName" \
                --output tsv
            )"

            live_image="$(
              az containerapp show \
                --name "${CONTAINER_APP}" \
                --resource-group "${RESOURCE_GROUP}" \
                --query "properties.template.containers[0].image" \
                --output tsv
            )"

            echo "Attempt ${attempt}/30"
            echo "Ready revision: ${ready_revision}"
            echo "Live image: ${live_image}"

            if [ -n "${ready_revision}" ] && [ "${live_image}" = "${expected_image}" ]; then
              echo "Container App revision is ready."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for the new Container App revision."
          exit 1

      - name: Resolve API hostname
        id: endpoint
        shell: bash
        run: |
          fqdn="$(
            az containerapp show \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv
          )"

          echo "fqdn=${fqdn}" >> "${GITHUB_OUTPUT}"
          echo "API hostname: ${fqdn}"

      - name: Verify API readiness
        shell: bash
        run: |
          url="https://${{ steps.endpoint.outputs.fqdn }}/health/ready"

          echo "Checking ${url}"

          for attempt in $(seq 1 30); do
            status="$(
              curl \
                --silent \
                --show-error \
                --output /tmp/casemesh-health.json \
                --write-out "%{http_code}" \
                --max-time 15 \
                "${url}" || true
            )"

            echo "Attempt ${attempt}/30 - HTTP ${status}"

            if [ "${status}" = "200" ]; then
              cat /tmp/casemesh-health.json
              echo
              echo "API readiness check passed."
              exit 0
            fi

            sleep 10
          done

          echo "API readiness check failed."
          exit 1

      - name: Verify deployed image
        shell: bash
        run: |
          expected_image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          deployed_image="$(
            az containerapp show \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "properties.template.containers[0].image" \
              --output tsv
          )"

          ready_revision="$(
            az containerapp show \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "properties.latestReadyRevisionName" \
              --output tsv
          )"

          echo "Expected image: ${expected_image}"
          echo "Deployed image: ${deployed_image}"
          echo "Ready revision: ${ready_revision}"

          test "${deployed_image}" = "${expected_image}"

      - name: Roll back on deployment failure
        if: ${{ failure() && steps.previous.outputs.image != '' }}
        shell: bash
        run: |
          previous_image="${{ steps.previous.outputs.image }}"

          echo "Deployment failed."
          echo "Rolling back to: ${previous_image}"

          az containerapp update \
            --name "${CONTAINER_APP}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${previous_image}" \
            --output none

          echo "Rollback command completed."